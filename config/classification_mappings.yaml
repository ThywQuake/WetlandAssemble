classification_config:
  version: "1.0"
  description: >
    Unified 8-class crosswalk for comparing wetland classification accuracy
    across G2017, GLWD v2, and GWD30. All open water bodies are grouped into
    Water. Peatland is treated as a separate class. Non-wetland is added for
    completeness.

  unified_classes:
    - id: 0
      name: Non-wetland
      description: Dryland or non-wetland land cover
    - id: 1
      name: Water
      description: >
        All open water bodies, including rivers, lakes, reservoirs, estuaries,
        lagoons, shallow marine waters, streams, canals, and other permanent waterbodies
    - id: 2
      name: Inland Herbaceous Wetlands
      description: >
        Natural inland wetlands dominated by herbaceous or non-woody vegetation,
        including marshes, wet meadows, and non-forested palustrine/lacustrine/riverine wetlands
    - id: 3
      name: Forested Wetlands
      description: >
        Natural wetlands dominated by woody vegetation, excluding peatlands
    - id: 4
      name: Peatland
      description: >
        Peat-accumulating wetlands, including bogs, fens, and all peatland classes,
        regardless of whether they are forested or non-forested
    - id: 5
      name: Floodplain Wetlands
      description: >
        Wetlands strongly controlled by river flooding, including floodplains
        and riverine regularly/seasonally flooded wetlands
    - id: 6
      name: Coastal Wetlands
      description: >
        Coastal or tidal wetlands, including mangroves, saltmarshes, tidal flats,
        coastal marshes, coastal swamps, deltas, and saline/brackish coastal wetlands
    - id: 7
      name: Artificial Wetlands
      description: >
        Human-managed wetland or wet-surface classes, such as rice paddies and aquaculture

  priority_rules:
    description: >
      Use this priority when a source class could plausibly match more than one unified class.
      Earlier rules take precedence over later ones.
    order:
      - Water
      - Artificial Wetlands
      - Peatland
      - Coastal Wetlands
      - Floodplain Wetlands
      - Forested Wetlands
      - Inland Herbaceous Wetlands
      - Non-wetland

  datasets:
    G2017:
      dataset_name: "Fine Combination / G2017"
      classes:
        "10":
          original_name: "Open Water"
          geomorphology: "Lakes and permanent rivers"
          unified_class: "Water"
          unified_id: 1

        "20":
          original_name: "Mangrove"
          geomorphology: "In close proximity to coast or estuaries"
          unified_class: "Coastal Wetlands"
          unified_id: 6

        "30":
          original_name: "Swamps (Incl. bogs)"
          geomorphology: "Usually bound to valleys and plains; planar surfaces"
          unified_class: "Peatland"
          unified_id: 4
          note: >
            Mapped to Peatland because this mixed class explicitly includes bogs,
            and peatland is required as a separate target class.

        "40":
          original_name: "Fens"
          geomorphology: "In valleys or lower slope positions"
          unified_class: "Peatland"
          unified_id: 4

        "50":
          original_name: "Riverine and Lacustrine"
          geomorphology: "Aligned with the adjacent water body"
          unified_class: "Inland Herbaceous Wetlands"
          unified_id: 2
          note: >
            Interpreted as wetland associated with adjacent rivers/lakes rather than
            open water itself.

        "60":
          original_name: "Floodplains"
          geomorphology: "Floodouts: On alluvial deposits"
          unified_class: "Floodplain Wetlands"
          unified_id: 5

        "70":
          original_name: "Floodplains"
          geomorphology: "Floodplains: On alluvial deposits or in valleys"
          unified_class: "Floodplain Wetlands"
          unified_id: 5

        "80":
          original_name: "Marshes"
          geomorphology: "General marshes: in valleys and plains, coastal marshes, salt marshes, savannah"
          unified_class: "Inland Herbaceous Wetlands"
          unified_id: 2
          note: >
            Although the description includes some coastal marsh references, this class
            is kept as Inland Herbaceous Wetlands for stable cross-dataset comparison.

        "90":
          original_name: "Marshes"
          geomorphology: "Wetlands in arid climate: formed in channel valleys and over alluvial"
          unified_class: "Inland Herbaceous Wetlands"
          unified_id: 2

        "100":
          original_name: "Marshes"
          geomorphology: "Wet meadows: transition zones between wetlands and surrounding drylands"
          unified_class: "Inland Herbaceous Wetlands"
          unified_id: 2

