    short_intro: "The Sudd is a vast inland wetland formed by the White Nile and its distributary channels, flood basins, marshes, and floating vegetation. It is a key hydrological and ecological feature of the upper Nile system."
    short_intro_zh: "苏德湿地是由白尼罗河及其分汊水道、洪泛盆地、沼泽和漂浮植被共同形成的巨大内陆湿地，是上尼罗河系统的关键水文与生态核心。"
