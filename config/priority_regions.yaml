    short_intro: "Pantanal is a vast lowland wetland complex dominated by annual flood pulses, marshes, shallow lakes, river channels, and seasonally inundated vegetation mosaics. It is widely regarded as one of the most iconic tropical wetlands in the world."
    short_intro_zh: "潘塔纳尔是一个受年度洪水脉动控制的广阔低地湿地复合体，包括沼泽、浅湖、河道以及季节性淹水植被镶嵌景观，被广泛视为世界最具代表性的热带湿地之一。"
