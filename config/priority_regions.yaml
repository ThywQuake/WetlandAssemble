    rationale: "This window captures the core western-to-central Amazon lowland wetland belt, one of the world's largest and most important tropical freshwater wetland regions."
    rationale_zh: "该窗口覆盖亚马孙低地湿地带的核心部分，是全球最大、最重要的热带淡水湿地区域之一。"
    short_intro: "The Amazon region contains an immense mosaic of river channels, floodplains, seasonally flooded forests, swamps, and floodplain lakes. It is globally important for biodiversity, freshwater storage, hydrological connectivity, and carbon cycling."
    short_intro_zh: "亚马孙地区包含巨大的河道、泛滥平原、季节性洪泛森林、沼泽和河漫滩湖泊复合体，在全球生物多样性、淡水调蓄、水文连通性和碳循环中具有核心地位。"
