    short_intro: "The Orinoco region is characterized by seasonally inundated plains, river corridors, marshes, and wet savannas. It is one of the most important tropical floodpulse landscapes in northern South America."
    short_intro_zh: "奥里诺科地区以季节性淹水平原、河流廊道、沼泽和湿润稀树草原为主要特征，是南美北部最重要的热带洪水脉动景观之一。"
