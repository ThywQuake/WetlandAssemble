    rationale: "This broad window spans the Indo-Gangetic alluvial lowlands, one of the world's most extensive floodplain regions, containing many riverine, lacustrine, and monsoon-fed wetlands."
    rationale_zh: "该广域窗口覆盖印度河—恒河冲积低地，是世界上最广阔的泛滥平原区域之一，包含大量河流型、湖泊型和季风补给型湿地。"
    short_intro: "The Indo-Gangetic region is not a single wetland but a vast wetland-rich alluvial corridor shaped by the Indus, Ganges, Brahmaputra, and associated rivers. It includes floodplains, marshes, oxbow lakes, seasonally inundated depressions, and many internationally important wetlands."
    short_intro_zh: "印度河—恒河平原并不是单一湿地，而是由印度河、恒河、布拉马普特拉河及其支流共同塑造的巨大冲积湿地走廊，包含泛滥平原、沼泽、牛轭湖、季节性低洼积水区以及大量具有国际意义的湿地。"
    source_urls:
