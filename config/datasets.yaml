# Wetland dataset configuration
# Update paths to point to your local data directories

datasets:
  berkeley_rwawc:
    name: "Berkeley-RWAWC"
    description: "UC Berkeley Remote Sensing of Water Mask Monthly Data"
    type: "monthly_watermask"
    format: "netcdf"
    loader_type: "standardized_netcdf"
    source_kind: "standardized_annual"
    path: "~/Wetland_Assemble/data/standardized"
    annual_pattern: "berkeley_rwawc_{year}.nc"
    time_range:
      start: "2018-08"
      end: "2025-10"
    resolution: "500m"
    time_resolution: "monthly"
    is_static: false
    is_classification: false
    native_variables: ["watermask"]
    semantic_mapping:
      watermask: "auxiliary_open_water_mask"

  g2017:
    name: "G2017"
    description: "Global 2017 Wetland and Peatland Dataset"
    type: "static_wetland"
    format: "netcdf"
    loader_type: "standardized_netcdf"
    source_kind: "standardized_static"
    path: "~/Wetland_Assemble/data/standardized"
    file: "g2017.nc"
    resolution: "500m"
    is_static: true
    is_classification: true
    native_variables: ["frac_0", "frac_10", "frac_20", "frac_30", "frac_40", "frac_50", "frac_60", "frac_70", "frac_80", "frac_90", "frac_100", "peatland_frac_0", "peatland_frac_1"]
    semantic_mapping:
      frac_10: "open_water_fraction"
      frac_20: "coastal_wetland_fraction"
      frac_30: "peatland_fraction"
      frac_40: "peatland_fraction"
      peatland_frac_1: "peatland_presence_fraction"

  giems_mc:
    name: "GIEMS-MC"
    description: "Global Inundation Extent from Multi-Satellites - Monthly Climate"
    type: "monthly_inundation"
    format: "netcdf"
    loader_type: "netcdf"
    # Update path to your GIEMS-MC data directory
    path: "/lustre/home/2200013429/Wetland_Assemble/data/GIEMS_MC/"
    file: "GIEMS-MC_compressed_v1.1.nc"
    time_range:
      start: "1993-01"
      end: "2007-12"
    resolution: "0.25° (~25km)"
    variables:
      inundation: "inundation"

  glwd_v2:
    name: "GLWD v2"
    description: "Global Lakes and Wetlands Database v2"
    type: "static_wetland"
    format: "netcdf"
    loader_type: "standardized_netcdf"
    source_kind: "standardized_static"
    path: "~/Wetland_Assemble/data/standardized"
    file: "glwd_v2.nc"
    resolution: "500m"
    is_static: true
    is_classification: true
    native_variables: ["frac_0", "frac_1", "frac_2", "frac_3", "frac_4", "frac_5", "frac_6", "frac_7", "frac_8", "frac_9", "frac_10", "frac_11", "frac_12", "frac_13", "frac_14", "frac_15", "frac_16", "frac_17", "frac_18", "frac_19", "frac_20", "frac_21", "frac_22", "frac_23", "frac_24", "frac_25", "frac_26", "frac_27", "frac_28", "frac_29", "frac_30", "frac_31", "frac_32", "frac_33"]
    semantic_mapping:
      frac_1: "open_water_fraction"
      frac_28: "coastal_wetland_fraction"
      frac_29: "coastal_wetland_fraction"
      frac_33: "artificial_wetland_fraction"

  gwd30:
    name: "GWD30"
    description: "Global Wetland Dataset 30m Annual"
    type: "annual_wetland"
    format: "geotiff"
    loader_type: "gwd30"
    mosaic_needed: true
    path: "/lustre/home/2200013429/Wetland_Assemble/data/GWD30/"
    years:
      - 2013
      - 2014
      - 2015
      - 2016
      - 2017
      - 2018
      - 2019
      - 2020
      - 2021
      - 2022
    pattern: "{year}/*_wetland_{year}.tif"
    resolution: "30m"

  lstm_wetland:
    name: "LSTM Wetland"
    description: "LSTM-based Wetland Prediction"
    type: "prediction"
    format: "netcdf"
    loader_type: "netcdf"
    # Update path to your LSTM data directory
    path: "/lustre/home/2200013429/Wetland_Assemble/data/LSTM/"
    file: "prediction.nc"

  swamps:
    name: "SWAMPS"
    description: "Surface Water Microwave Product Series"
    type: "daily_inundation"
    format: "netcdf"
    loader_type: "swamps"
    # Update path to your SWAMPS data directory
    path: "/lustre/home/2200013429/Wetland_Assemble/data/SWAMPS/"
    pattern: "stable/{year}/{month}/*.nc"
    time_range:
      start: "1992-01-01"
      end: "2020-12-31"
    resolution: "25km"
    sensor_shift_year: 2000

  topmodel:
    name: "TOPMODEL"
    description: "TOPMODEL-based Wetland Simulation"
    type: "model_output"
    format: "netcdf"
    loader_type: "standardized_netcdf"
    source_kind: "standardized_annual"
    path: "~/Wetland_Assemble/data/standardized"
    annual_pattern: "topmodel_{year}.nc"
    time_resolution: "monthly"
    resolution: "500m"
    is_static: false
    is_classification: false
    native_variables: ["wetland_fraction"]
    semantic_mapping:
      wetland_fraction: "topmodel_simulated_wetland_fraction"

  wad2m:
    name: "WAD2M"
    description: "Wetland Area and Dynamics for Methane Modeling"
    type: "monthly_wetland"
    format: "netcdf"
    loader_type: "netcdf"
    # Update path to your WAD2M data directory
    path: "/lustre/home/2200013429/Wetland_Assemble/data/WAD2M/data/"
    file: "WAD2M_wetlands_2000-2020_025deg_Ver2.0.nc"
    time_range:
      start: "2000-01"
      end: "2020-12"
    resolution: "0.25° (~25km)"

# Analysis regions
regions:
  tropical:
    name: "Tropical"
    bbox: [-180, -23.5, 180, 23.5]  # [min_lon, min_lat, max_lon, max_lat]

  subtropical:
    name: "Subtropical"
    bbox: [-180, -35, 180, -23.5]

  tropical_subtropical:
    name: "Tropical and Subtropical"
    bbox: [-180, -35, 180, 23.5]

  global:
    name: "Global"
    bbox: [-180, -90, 180, 90]

# Analysis parameters
analysis:
  spatial_metrics: ["OA", "Kappa", "PA", "UA", "IoU", "F1-Score"]
  trend_tests: ["Mann-Kendall", "Sen's Slope"]
  aggregation_levels: ["annual", "seasonal", "monthly"]
  confidence_level: 0.95
